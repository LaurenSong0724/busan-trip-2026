body{
  font-family:'TripFont','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;
  background:#dff6ff;
  color:#172033;
  overflow:hidden;
  user-select:none;
  line-height:1.6;
}
button,input,select{font-family:inherit}
.app-outer{
  min-height:100vh;
  display:flex;
  justify-content:center;
  background-image:linear-gradient(rgba(255,255,255,.16),rgba(255,247,237,.18)),var(--bg);
  background-size:cover;
  background-position:center;
}
@supports(height:100dvh){.app-outer{min-height:100dvh}}
.app-shell{
  width:100%;
  max-width:460px;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:rgba(255,250,245,.58);
  box-shadow:0 0 45px rgba(15,23,42,.15);
}
@supports(height:100dvh){.app-shell{height:100dvh}}
.app-shell::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.02),rgba(255,250,245,.20)),var(--bg);
  background-size:cover;
  background-position:center top;
  opacity:.95;
}
.screen{position:relative;z-index:1;height:100%;}
.glass{background:rgba(255,250,245,.92);backdrop-filter:blur(16px)}
header{
  position:absolute;top:0;left:0;right:0;z-index:40;
  padding:12px 24px 10px;
  border-bottom:1px solid rgba(186,230,253,.75);
}
.kicker{font-size:.8rem;font-weight:1000;color:#f97316;letter-spacing:.13em}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.86rem;line-height:1.08;margin:.15rem 0 0;font-weight:1000;color:#172033;letter-spacing:.02em}
.subtitle{font-size:.92rem;font-weight:900;color:#64748b;margin-top:.25rem}
.tabs{display:flex;gap:12px;margin-top:12px}
.tab{border:1px solid #bae6fd;border-radius:999px;padding:11px 20px;background:white;color:#0369a1;font-weight:1000;font-size:.96rem}
.tab.active{background:#0ea5e9;color:white;border-color:#0ea5e9}
.scroll{
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:235px 22px 128px;
}
.scroll::-webkit-scrollbar{width:4px} .scroll::-webkit-scrollbar-thumb{background:#7dd3fc;border-radius:10px}
.card{
  background:rgba(255,255,255,.91);
  backdrop-filter:blur(10px);
  border:2px solid rgba(186,230,253,.84);
  border-radius:34px;
  padding:1.05rem;
  margin-bottom:1rem;
  box-shadow:0 10px 26px rgba(14,165,233,.11);
}
.day-card{background:linear-gradient(135deg,rgba(255,255,255,.94),rgba(240,249,255,.90))}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.day-label{font-size:.78rem;font-weight:1000;color:#0284c7;letter-spacing:.08em}
.day-title{font-size:1.35rem;font-weight:1000;color:#172033;line-height:1.2;margin-top:.15rem}
.day-note{margin-top:.75rem;padding:.55rem .75rem;border-radius:18px;background:#fff7ed;border:1px solid #fed7aa;font-size:.82rem;font-weight:900;color:#9a3412;white-space:pre-line}
.day-nav{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.day-pill{border:1px solid #bae6fd;border-radius:999px;padding:9px 12px;background:white;color:#0369a1;font-weight:1000;white-space:nowrap}
.day-pill.active{background:#0ea5e9;color:white}
.item-card{
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  border:1.6px solid rgba(186,230,253,.88);
  border-radius:32px;
  padding:1rem;
  margin-bottom:.9rem;
  box-shadow:0 8px 20px rgba(15,23,42,.06);
}
.item-row{display:flex;gap:14px;align-items:flex-start}
.icon-frame{
  width:52px;height:52px;flex:none;border-radius:18px;
  background:linear-gradient(135deg,#fff,#e0f7ff);
  border:2px solid #bae6fd;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:0 5px 12px rgba(14,165,233,.15);
}
.icon-frame img,.mini-icon img,.welcome-icon img{
  width:100%;height:100%;object-fit:cover;object-position:center;

  --ink:#21465d;
  --sky:#66c8ef;
  --deep:#1689b8;
  --sea:#38b8c9;
  --cream:#fffaf2;
  --coral:#ff8fa6;
  --mint:#9fe1cf;
  --yellow:#ffd978;
}

html,body,#app,button,input,select,textarea,
h1,h2,h3,h4,p,span,div,label {
  font-family:'TripFont','Microsoft JhengHei','PingFang TC',sans-serif !important;
}

body {
  background:#70ccec !important;
  color:var(--ink) !important;
}

.welcome-screen,
.app-shell {
  background:
    linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.12)),
    var(--busan-bg) center/cover fixed no-repeat !important;
}

.welcome-screen::before,
.app-shell::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,.02),rgba(27,118,151,.12));
  z-index:0;
}

.welcome-card,
header,
.scroll,
.bottom-nav,
.modal {
  position:relative;
  z-index:1;
}

.welcome-card {
  width:min(88vw,620px) !important;
  background:rgba(255,250,242,.94) !important;
  border:2px solid rgba(255,255,255,.88) !important;
  box-shadow:0 20px 45px rgba(13,77,104,.22) !important;
  backdrop-filter:blur(10px);
}

.welcome-card::before {
  content:"";
  display:block;
  width:230px;
  height:120px;
  margin:0 auto 10px;
  background:var(--busan-icons) center/contain no-repeat;
}

.welcome-icon { display:none !important; }

.welcome-kicker {
  color:var(--deep) !important;
  letter-spacing:.12em !important;
}

.welcome-title {
  color:#17384f !important;
  font-size:clamp(2rem,7vw,3rem) !important;
  line-height:1.18 !important;
}

.welcome-desc {
  color:#537085 !important;
}

.welcome-btn,
.tab.active,
.day-pill.active,
.bag-tab.active,
.person-tab.active,
.next,
.add-row button,
.shared-add button,
.souvenir-add-btn {
  background:linear-gradient(180deg,#34b6df,#1591bf) !important;
  border-color:#1591bf !important;
  color:white !important;
  box-shadow:0 5px 0 #0d6f98 !important;
}

.card,
.item-card,
.settlement-card,
.packing-page .card,
.souvenir-page .card {
  background:rgba(255,250,242,.94) !important;
  border:1.5px solid rgba(63,166,202,.35) !important;
  box-shadow:0 10px 22px rgba(25,105,135,.11) !important;
}

.day-head,
.header-brand {
  background:rgba(255,250,242,.90) !important;
  border-color:rgba(63,166,202,.28) !important;
}

.busan-picture-icon {
  width:100%;
  height:100%;
  display:block;
}

const ITINERARY=[{"date":"10月5日(一)","title":"10月5日(一) 出發前往機場","dayNote":"","items":[{"time":"16:45","name":"下班出發租URiDE","intro":"","note":"","nav":"https://maps.app.goo.gl/V1ntvaH1BGAjqQy19","icon":"default"},{"time":"22:15","name":"離開聯悦臻出發機場","intro":"","note":"","nav":"https://maps.app.goo.gl/o2Lnhf4SvfQgPfgz5","icon":"default"}],"docDay":0},{"date":"10月6日(二)","title":"10月6日(二) 釜山・南浦洞・海雲台","dayNote":"","items":[{"time":"02:35","name":"飛機出發前往釜山","intro":"易斯達航空 ZE988\n桃園國際機場第一航廈直飛釜山金海國際機場\n航程時間約2個半小時","note":"","nav":"","icon":"default"},{"time":"06:05","name":"抵達釜山","intro":"LG U+櫃檯領免費T-money卡，位置於國際線航廈1樓入境大廳GATE 2至3旁","note":"","nav":"https://maps.app.goo.gl/JzjqCWkRcsjpk9dWA","icon":"default"},{"time":"","name":"利木津巴士","intro":"GATE 3出來之後往右走到巴士售票處(靠近GATE 5)\n最早從機場出發約07:10，下一班約07:50、08:30\n乘車處則在GATE 3附近\n⭐ 於海雲台溫泉十字路口(09086)－해운대온천사거리下車\n車程約90~110分鐘，票價約9,500韓元","note":"","nav":"https://naver.me/GahNpiRk","icon":"default"},{"time":"","name":"Fairfield by Marriott Busan釜山萬楓酒店","intro":"下車後斜對面就是萬楓酒店，一樓大廳櫃檯提供免費行李寄存\n⭐ 下層直接相連CU便利商店，要儲值T-money卡","note":"","nav":"https://naver.me/xF4nfx1q","icon":"default"},{"time":"","name":"早餐｜DIART","intro":"以招牌的「土耳其Kaymak蜂蜜奶油白法棍」在社群平台爆紅，使用外酥內軟的白法棍，搭配濃郁且口感介於奶霜和奶油之間的土耳其傳統Kaymak乳酪與香甜蜂蜜，被許多遊客譽為「人生麵包」\n店家堅持自家烘焙咖啡豆，點購咖啡有時會附贈一包濾掛式咖啡做為伴手禮\n⭐ 青沙浦本店擁有無敵海景，推薦二樓窗邊座位\n⭐ 現場客滿時需直接至櫃檯向店員領取號碼牌，依序等待叫號入座","note":"","nav":"https://naver.me/FvTsUSzQ","icon":"default"},{"time":"","name":"海東龍宮寺","intro":"建於1376年高麗王朝，是韓國極少數依海而建的臨海寺廟，與多數隱蔽在山林中的寺院不同，它完美融合了蔚藍海景與莊嚴佛教文化，被譽為「韓國最美海景寺廟」及韓國三大觀音聖地之一\n由懶翁大師創建時原名「普門寺」，可惜原建築在萬曆朝鮮之役中全數燒毀，1970年代重建，傳說住持夢見白衣觀音乘龍顯靈，於1974年正式改名為海東龍宮寺\n入口處有一字排開的十二生肖石像守護神，從上到下共有一百零八階長壽階梯象徵放下人世間108種煩惱\n海水觀音大佛，面朝大海靜靜守護眾生，高約10公尺，是全韓國最大的單一石材觀音像\n⭐ 參拜方式十分特別，參拜時要先點蠟燭、上香、接著脫鞋、跪下，並掌心朝上趴跪祈求保佑，然後起身站立，而趴跪膜拜動作要作七次，這樣才是完整的參拜方式\n⭐ 相傳此地磁場極強，寺廟外靠海處有座相當醒目的紅綠色郵筒，清楚寫著「世界唯一不送郵便函」，是讓民眾寫下心願投入，寺廟每年會在特定時間，取出民眾寫下的心願紙條，燒成灰後灑向大海，並祝心願實現\n⭐ 許願青銅瓦片位於寺內「四獅三層石塔」旁的祈福小物與法器販售區，每片費用為10,000 韓元，可用現場提供的白色麥克筆在瓦片上親筆寫下個人姓名、居住地、全家平安、事業順利或各種心願，費用同時作為寺廟修繕與維護之用\n⭐ 海東龍宮寺販售多款平價的開運祈福手鍊、水晶串珠與吊飾，常見 function tripCountdown(){

function setScrollStable(v){
  const sc=document.querySelector('.scroll');
  if(!sc) return;
  sc.scrollTop=v;
  requestAnimationFrame(()=>{ sc.scrollTop=v; requestAnimationFrame(()=>{ sc.scrollTop=v; }); });
  setTimeout(()=>{ const s=document.querySelector('.scroll'); if(s) s.scrollTop=v; }, 80);
}
function restoreScroll(){
  const sc=document.querySelector('.scroll');
  if(sc) {
    const v=Number(localStorage.getItem(getScrollKey()) || sessionStorage.getItem('busan_last_scroll') || 0);

  }
}

function itineraryIconKey(item){
  const n=String(item?.name||'');
  if(/飛機|機場|出發|抵達/.test(n)) return 'flight';
  if(/早餐|午餐|晚餐|湯|粥|飯捲|麵包|烤蛤|市場|披薩|雞|BBQ|帝王蟹|參雞湯|DIART|EGG DROP/.test(n)) return 'food';
  if(/Club D|Oasis|海|水族館|夜景|荒嶺山|廣安里|X the SKY/.test(n)) return 'ocean';
  if(/飯店|Check In|退房|放戰利品/.test(n)) return 'hotel';
  if(/Luge|樂天世界|雲霄飛車|碰碰車|火車|旋轉木馬|遊行|Castle|Swing|舞台/.test(n)) return 'lion';
  if(/膠囊列車|纜車|單軌|前往/.test(n)) return 'car';
  if(/龍宮寺/.test(n)) return 'shrine';
  if(/校服|MUSINSA|Wannabe|Olive Young|ABC MART|大創|樂天超市|Outlet|藥局|EPT|North Face|甘川洞|BIFF|Clam Sand|LUFT|Hetras|手翻書/.test(n)) return 'shopping';
  return item?.icon || 'default';
}

function packingPercent(person){
  const rows=packingItems.filter(x=>x.person===person);
  if(!rows.length) return {done:0,total:0,pct:0};
  const done=rows.filter(x=>x.checked).length;
  return {done,total:rows.length,pct:Math.round(done*100/rows.length)};
}
function sortedRows(rows){
  return [...rows].sort((a,b)=>Number(a.checked)-Number(b.checked) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
}

function validateSupabaseConfig(){
  if(!SUPABASE_KEY || SUPABASE_KEY.includes('PASTE_YOUR_')){
    packingStatus='請先在 index.html 貼上 Supabase Publishable Key';
    console.warn('Supabase 尚未設定：請把 SUPABASE_KEY 換成專案的 Publishable key。');
    return false;
  }
  return true;
}

function ensureSupabase(){
  if(!validateSupabaseConfig()) return false;
  if(sb) return true;
  if(!window.supabase || !window.supabase.createClient){packingStatus='Supabase 載入失敗'; return false;}
  sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return true;
}
async function loadPacking(){
  if(!ensureSupabase()) { render(true); return; }
  packingStatus='同步中';
  try{
    const [p,s]=await Promise.all([
      sb.from('packing_items').select('*').order('created_at',{ascending:true}),
      sb.from('shared_items').select('*').order('created_at',{ascending:true})
    ]);
    if(p.error) throw p.error;
    if(s.error) throw s.error;
    packingItems=(p.data||[]).map(row=>({...row,person:normalizePersonValue(row.person)}));
    sharedItems=(s.data||[]).map(row=>({
      ...row,
      owner:normalizePersonValue(row.owner||row.carrier),
      carrier:normalizePersonValue(row.carrier||row.owner)
    }));
    packingStatus='已同步';
  }catch(err){
    console.error(err);
    packingStatus='同步失敗';
  }
  if(state.started && state.tab==='packing') render(true);
}
function initPackingSync(){
  if(packingStarted || !ensureSupabase()) return;
  packingStarted=true;
  loadPacking();
  try{
    sb.channel('busan-packing-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'packing_items'},()=>loadPacking())
      .on('postgres_changes',{event:'*',schema:'public',table:'shared_items'},()=>loadPacking())
      .subscribe(status=>{ if(status==='SUBSCRIBED'){packingStatus='已連線'; if(state.started && state.tab==='packing') render(true);} });
  }catch(err){console.error(err); packingStatus='即時同步失敗';}
}
async function addPackingItem(person){
  const input=document.querySelector(`[data-add-input="${CSS.escape(person)}"]`);
  const item=(input?.value||'').trim();
  if(!item) return;
  if(!ensureSupabase()) return alert('Supabase 尚未連線');
  input.value='';
  const {error}=await sb.from('packing_items').insert({person, bag_type:state.bag, item, checked:false});
  if(error) alert('新增失敗：'+error.message); else loadPacking();
}
async function togglePacking(id){
  const row=packingItems.find(x=>String(x.id)===String(id)); if(!row||!ensureSupabase()) return;
  const {error}=await sb.from('packing_items').update({checked:!row.checked, updated_at:new Date().toISOString()}).eq('id',id);
  if(error) alert('更新失敗：'+error.message); else loadPacking();
}
async function deletePacking(id){
  if(!confirm('確定刪除這個物品嗎？')||!ensureSupabase()) return;
  const {error}=await sb.from('packing_items').delete().eq('id',id);
  if(error) alert('刪除失敗：'+error.message); else loadPacking();
}

  if(error) alert('修改失敗：'+error.message); else loadPacking();
}
async function addSharedItem(){
  const itemEl=document.querySelector('[data-shared-item]');

const SOUVENIR_STORES=['全部','Olive Young','大創','藥局','CU','樂天超市'];

function souvenirStore(row){
 const allowed=['Olive Young','大創','藥局','CU','樂天超市'],saved=String(row?.store||'').trim();
 if(allowed.includes(saved))return saved;
 const text=`${row?.item||''} ${row?.note||''}`;
 if(/Olive\s*Young/i.test(text))return'Olive Young';
 if(/大創|Daiso/i.test(text))return'大創';
 if(/國際藥局|大同藥局|藥局|Gukje|Daedong/i.test(text))return'藥局';
 if(/\bCU\b/i.test(text))return'CU';
 if(/樂天超市|Lotte\s*Mart/i.test(text))return'樂天超市';
 return'其他';
}

const SHOP_PHOTO_SEED_MARK='SHOPPHOTO20260929R3';

function cleanSouvenirNote(note){
  return String(note||'')
    .split('\n')
    .filter(line=>!/^SHOPPHOTO\d+(?:R\d+)?$/.test(line.trim()))
    .join('\n')
    .trim();
}

async function ensurePhotoShoppingSeed(){
  if(!ensureSupabase()) return;
  try{
    const {data:existing,error}=await sb.from('souvenir_items').select('id').eq('person','老婆').limit(1);
    if(error) throw error;
    if(existing && existing.length) return;
    const rows=SHOP_PHOTO_SEED.map(r=>({...r,note:cleanSouvenirNote(r.note)}));
    for(let i=0;i<rows.length;i+=35){
      const {error:insErr}=await sb.from('souvenir_items').insert(rows.slice(i,i+35));
      if(insErr) throw insErr;
    }
  }catch(e){console.error('照片買買買清單初始化失敗',e);}
}

function souvenirItemHTML(row){
  const done=!!row.purchased;
  const photoSrc=row.image_url || SHOP_PHOTO_IMAGES[row.item] || '';
  const image=photoSrc ? `<div class="souvenir-photo"><img src="${photoSrc}" alt="${esc(row.item||'買買買')}" loading="lazy" /></div>` : `<div class="souvenir-photo"><div class="souvenir-placeholder">🎁</div></div>`;
  const visibleNote=cleanSouvenirNote(row.note);
  return `<div class="card souvenir-card ${done?'is-done':''}">
    ${image}
    <div class="souvenir-body">
      <div class="souvenir-store-badge">🏬 ${esc(souvenirStore(row))}</div>
      <div class="souvenir-name ${done?'done':''}">${esc(row.item||'')}</div>
      ${visibleNote ? `<div class="souvenir-note">${nl(visibleNote)}</div>` : ''}
      <div class="souvenir-actions">
        <button class="souvenir-bought ${done?'on':''}" data-souvenir-toggle="${esc(row.id)}">${done?'✓ 已買':'□ 尚未買'}</button>
        <button class="souvenir-small-btn" data-souvenir-edit="${esc(row.id)}">修改</button>
        <button class="souvenir-small-btn" data-souvenir-delete="${esc(row.id)}">刪除</button>
      </div>
    </div>
  </div>`;
}

async function initSouvenirSync(){

      .on('postgres_changes',{event:'*',schema:'public',table:'souvenir_items'},()=>loadSouvenirs())

}
async function compressImage(file){
  if(!file) return null;
  if(!file.type.startsWith('image/')) throw new Error('請選擇圖片檔');
  const bitmap=await createImageBitmap(file);
  const max=760;
  const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
  const w=Math.max(1,Math.round(bitmap.width*scale));
  const h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
  bitmap.close?.();
  return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('圖片壓縮失敗')),'image/webp',0.72));
}
async function uploadSouvenirImage(file,person){
  if(!file) return {url:'',path:''};
  const blob=await compressImage(file);
  const url=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||''));
    reader.onerror=()=>reject(new Error('圖片讀取失敗'));
    reader.readAsDataURL(blob);
  });
  return {url,path:''};
}

let guideSyncChannel=null;
async function pullGuideState(key){
  if(!sb)return;
  try{
    const {data,error}=await sb.from('trip_guide_state').select('*').eq('guide_key',key).maybeSingle();
    if(error)throw error;
    if(data){
      localStorage.setItem(key,JSON.stringify({
        order:Array.isArray(data.order_json)?data.order_json:[],
        skipped:(data.skipped_json&&typeof data.skipped_json==='object')?data.skipped_json:{}
      }));
    }else{
      const local=JSON.parse(localStorage.getItem(key)||'{"order":[],"skipped":{}}');
      await sb.from('trip_guide_state').upsert({
        guide_key:key,
        order_json:Array.isArray(local.order)?local.order:[],
        skipped_json:local.skipped||{},
        updated_at:new Date().toISOString()
      },{onConflict:'guide_key'});
    }
  }catch(e){console.warn('guide pull',e)}
}
async function pushGuideState(key,s){
  localStorage.setItem(key,JSON.stringify(s));
  if(!sb)return;
  try{
    const {error}=await sb.from('trip_guide_state').upsert({
      guide_key:key,
      order_json:Array.isArray(s.order)?s.order:[],
      skipped_json:s.skipped||{},
      updated_at:new Date().toISOString()
    },{onConflict:'guide_key'});
    if(error)throw error;
  }catch(e){console.warn('guide push',e)}
}
function subscribeGuideState(key){
  if(!sb)return;
  if(guideSyncChannel){try{sb.removeChannel(guideSyncChannel)}catch(_){}}
  guideSyncChannel=sb.channel('guide-'+key)
   .on('postgres_changes',{event:'*',schema:'public',table:'trip_guide_state',filter:'guide_key=eq.'+key},payload=>{
      if(!payload.new)return;
      localStorage.setItem(key,JSON.stringify({
        order:Array.isArray(payload.new.order_json)?payload.new.order_json:[],
        skipped:(payload.new.skipped_json&&typeof payload.new.skipped_json==='object')?payload.new.skipped_json:{}
      }));
      if(typeof state.modal==='object'&&state.modal.type==='guide')showModal();
   }).subscribe();
}

function guideRows(it){
  let rows=it.subitems || (it.shops||[]).map(s=>({name:(s.floor?s.floor+'｜':'')+s.name,time:'',intro:'',nav:''}));
  const key=guideKey(it), saved=JSON.parse(localStorage.getItem(key)||'{}');
  if(Array.isArray(saved.order)) rows=saved.order.map(n=>rows.find(x=>x.name===n)).filter(Boolean).concat(rows.filter(x=>!saved.order.includes(x.name)));
  return {rows,saved,key};
}
function saveGuideState(key,s){localStorage.setItem(key,JSON.stringify(s));pushGuideState(key,s);}

function downloadHanbokICS(){

  const [h,m]=start.split(':').map(Number); const st=new Date(2026,9,9,h,m); const en=new Date(st.getTime()+60*60000);
  const fmt=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Busan Trip//Hanbok//ZH-TW\r\nBEGIN:VEVENT\r\nDTSTART:${fmt(en)}\r\nDTEND:${fmt(new Date(en.getTime()+10*60000))}\r\nSUMMARY:歸還甘川洞韓服\r\nDESCRIPTION:回哲秀與英熙歸還韓服\r\nBEGIN:VALARM\r\nTRIGGER:-PT5M\r\nACTION:DISPLAY\r\nDESCRIPTION:5分鐘後要歸還韓服\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='甘川洞韓服歸還提醒.ics'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function bindModalExtras(){
 const host=document.getElementById('modal-root');if(!host)return;
 const d=ITINERARY[state.day],it=(typeof state.modal==='object'&&state.modal.type==='guide')?d.items[state.modal.index]:null;if(!it)return;
 const currentGuide=guideRows(it);
 subscribeGuideState(currentGuide.key);
 if(!window.__guidePulled||window.__guidePulled!==currentGuide.key){window.__guidePulled=currentGuide.key;pullGuideState(currentGuide.key).then(()=>{if(typeof state.modal==='object'&&state.modal.type==='guide')showModal()})}
 const rerender=()=>showModal();

 host.querySelectorAll('[data-guide-restore]').forEach(btn=>btn.onclick=()=>{const {saved,key}=guideRows(it);saved.skipped=saved.skipped||{};delete saved.skipped[btn.dataset.guideRestore];saveGuideState(key,saved);rerender()});
 host.querySelectorAll('[data-guide-detail]').forEach(b=>b.onclick=()=>{const {rows,saved}=guideRows(it),visible=rows.filter(x=>!(saved.skipped||{})[x.name]),x=visible[Number(b.dataset.guideDetail)];if(!x)return;const detail=document.createElement('div');detail.id='guide-detail-layer';detail.innerHTML=guideDetailModalHTML(x);host.appendChild(detail);const close=()=>detail.remove();detail.querySelector('[data-guide-detail-close]')?.addEventListener('click',close);detail.querySelector('[data-modal-bg]')?.addEventListener('click',e=>{if(e.target.dataset.modalBg)close()})});

 const list=host.querySelector('[data-guide-list]');
 if(list){
  let active=null,timer=null,sx=0,sy=0,drag=false;
  const clear=()=>{if(timer){clearTimeout(timer);timer=null}};
  const move=(el,y)=>{const others=[...list.querySelectorAll('.guide-item')].filter(x=>x!==el);const target=others.find(x=>{const r=x.getBoundingClientRect();return y>=r.top&&y<=r.bottom});if(target){const r=target.getBoundingClientRect();list.insertBefore(el,y<r.top+r.height/2?target:target.nextSibling)}};
  const arm=el=>{if(active!==el)return;drag=true;el.classList.add('dragging');document.body.classList.add('guide-dragging');navigator.vibrate?.(45)};
  const finish=(el,x,y)=>{if(active!==el)return;clear();const dx=x-sx,dy=y-sy;el.classList.remove('dragging');document.body.classList.remove('guide-dragging');if(drag){const {saved,key}=guideRows(it);saved.order=[...list.querySelectorAll('.guide-item')].map(n=>n.dataset.guideName);saveGuideState(key,saved)}else if(dx<-65&&Math.abs(dx)>Math.abs(dy)*1.1){const {saved,key}=guideRows(it);saved.skipped=saved.skipped||{};saved.skipped[el.dataset.guideName]=true;saveGuideState(key,saved);setTimeout(rerender,80)}active=null;drag=false};

  list.querySelectorAll('.guide-item').forEach(el=>{
   el.addEventListener('touchstart',e=>{if(e.target.closest('a,button,input')||e.touches.length!==1)return;const t=e.touches[0];active=el;sx=t.clientX;sy=t.clientY;drag=false;clear();timer=setTimeout(()=>arm(el),330)},{passive:true});
   el.addEventListener('touchmove',e=>{if(active!==el||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(!drag){if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy)*1.15)clear();else if(Math.abs(dy)>28)clear()}else{e.preventDefault();move(el,t.clientY);const modal=host.querySelector('.modal-body');if(modal){const r=modal.getBoundingClientRect();if(t.clientY<r.top+70)modal.scrollTop-=14;else if(t.clientY>r.bottom-70)modal.scrollTop+=14}}},{passive:false});
   el.addEventListener('touchend',e=>{if(active!==el)return;const t=e.changedTouches[0];finish(el,t.clientX,t.clientY)},{passive:true});
   el.addEventListener('touchcancel',()=>{clear();el.classList.remove('dragging');document.body.classList.remove('guide-dragging');active=null;drag=false});

   el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||e.target.closest('a,button,input'))return;active=el;sx=e.clientX;sy=e.clientY;drag=false;clear();timer=setTimeout(()=>arm(el),330)});
   el.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||active!==el)return;if(drag){e.preventDefault();move(el,e.clientY)}else if(Math.abs(e.clientY-sy)>20)clear()});
   el.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')finish(el,e.clientX,e.clientY)});
  });
 }
 host.querySelector('[data-hanbok-time]')?.addEventListener('change',e=>{localStorage.setItem('busan_hanbok_start',e.target.value);rerender()});
 host.querySelector('[data-hanbok-calendar]')?.addEventListener('click',downloadHanbokICS);
}

function appHTML(){

function render(keepScroll=true){
  const before=document.querySelector('.scroll');
  const oldTop=before ? before.scrollTop : null;
  document.getElementById('app').innerHTML = state.started ? appHTML() : welcomeHTML();
  const host=document.getElementById('modal-root');
  if(host && state.modal===null) host.innerHTML='';
  bind();
  const after=document.querySelector('.scroll');
  if(after){
    after.addEventListener('scroll', ()=>{window.clearTimeout(after._t); after._t=window.setTimeout(rememberScroll,80);}, {passive:true});
    if(keepScroll && oldTop!==null) setScrollStable(oldTop);

  }
}

function alignActiveDayPill(){
  requestAnimationFrame(()=>{
    const nav=document.querySelector('.day-nav');
    const active=nav?.querySelector('.day-pill.active');
    if(!nav||!active)return;
    nav.scrollTo({left:Math.max(0,active.offsetLeft-nav.offsetLeft),behavior:'auto'});
  });
}


if(!window.__dayPillAlignObserver){
  window.__dayPillAlignObserver=true;
  new MutationObserver(()=>{
    if(document.querySelector('.day-nav .day-pill.active')) setTimeout(alignActiveDayPill,0);
  }).observe(document.querySelector('#app')||document.body,{childList:true,subtree:true});
}

document.addEventListener('click', function v135ChoiceClick(e){
  const btn=e.target.closest('[data-choice-guide]');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const day=Number(btn.dataset.day);
  const index=Number(btn.dataset.index);
  const item=ITINERARY[day] && ITINERARY[day].items ? ITINERARY[day].items[index] : null;

}, true);

<script id="v123-live-weather">
(()=>{
const P={wuqi:['梧棲',24.2578,120.5317],haeundae:['海雲台',35.1631,129.1635],nampo:['南浦洞',35.0975,129.0345],seomyeon:['西面',35.1578,129.0590],gwangalli:['廣安里',35.1532,129.1187],gijang:['機張',35.2446,129.2223]};
const D={0:['wuqi'],1:['haeundae'],2:['haeundae'],3:['haeundae'],4:['nampo'],5:['seomyeon','gwangalli'],6:['gijang','wuqi']};
const ico=(c,d)=>c==0?(d?'☀️':'🌙'):[1,2].includes(c)?'🌤️':c==3?'☁️':[45,48].includes(c)?'🌫️':[51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c)?'🌧️':[71,73,75,77,85,86].includes(c)?'🌨️':[95,96,99].includes(c)?'⛈️':'🌡️';
async function now(p){let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&current=temperature_2m,weather_code,is_day&timezone=auto`,{cache:'no-store'});if(!r.ok)throw 0;return (await r.json()).current}
function visibleDay(){const label=document.querySelector('.day-card .day-label');if(!label)return null;const m=(label.textContent||'').match(/DAY\s*(\d+)/i);return m?Number(m[1]):null}
async function showWeather(force=false){
 const d=visibleDay(),card=document.querySelector('.day-card');if(d===null||!card||!D[d])return;
 const old=card.querySelector('.day-weather');if(old&&old.dataset.day===String(d)&&!force)return;
 document.querySelectorAll('.day-weather').forEach(e=>e.remove());
 const row=document.createElement('div');row.className='day-weather';row.dataset.day=String(d);
 const head=card.querySelector('.day-head');if(head)card.insertBefore(row,head);else card.prepend(row);
 for(const k of D[d]){const p=P[k],q=document.createElement('span');q.className='wx';q.textContent=`⏳ ${p[0]} --°C`;row.appendChild(q);try{const w=await now(p);if(!row.isConnected)return;q.textContent=`${ico(+w.weather_code,+w.is_day)} ${p[0]} ${Math.round(+w.temperature_2m)}°C`}catch(e){if(row.isConnected)q.textContent=`⚠️ ${p[0]} 更新失敗`}}
}
let timer;function schedule(){clearTimeout(timer);timer=setTimeout(()=>showWeather(false),120)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
new MutationObserver(()=>schedule()).observe(document.querySelector('#app')||document.body,{childList:true,subtree:false});
setInterval(()=>showWeather(true),600000);
})();

</script></body>
